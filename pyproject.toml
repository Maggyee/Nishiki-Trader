[project]
name = "trader"
version = "0.0.0"
description = "Personal quantitative trading system: LLM agents + freqtrade + nautilus_trader"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "nautilus-trader==1.226.0",
    "pydantic>=2.6",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "freqtrade",
    "nautilus_trader",
    "apps/strategies_freqtrade/user_data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
    "network: explicit external-data integration test",
    "postgres: integration test requiring TRADER_TEST_POSTGRES_DSN (*_test database)",
]
