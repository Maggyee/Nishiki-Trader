apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000

  # Postgres + TimescaleDB read-only datasource (trader_ro role).
  # Schema: see infra/postgres/init.sql.
  - name: Postgres
    uid: postgres-trader
    type: postgres
    access: proxy
    url: postgres:5432
    user: trader_ro
    secureJsonData:
      password: trader_ro_local
    jsonData:
      database: trader
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: false

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Postgres
    orgId: 1
