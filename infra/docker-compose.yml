# Phase 3 entry: 观测栈提前启用。
#
# 在 ADR-001 §6 表中, Grafana/Prometheus/Loki 被列在 Phase 5,
# 但 Phase 3 testnet canary 已经在产 heartbeat/alerts/manifest/sidecar,
# 提前启用观测栈不动信号/订单路径, 也不引入新的相位依赖.
#
# 端口约定: 所有 host 端口绑 127.0.0.1, 不暴露到公网.
# - Grafana:        127.0.0.1:3000
# - Prometheus:     127.0.0.1:9090
# - Loki:           127.0.0.1:3100
# - Promtail:       127.0.0.1:9080  (debug only)
# - node_exporter:  127.0.0.1:9100  (textfile collector for testnet_runner)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: trader-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node_exporter

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: trader-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/textfile"
      - "--collector.disable-defaults"
      - "--collector.textfile"
      - "--web.listen-address=:9100"
    volumes:
      - /:/host:ro,rslave
      # testnet_runner.py writes one .prom file per run_id into this
      # directory; the textfile collector only scrapes the top level
      # (no recursion), so the runner intentionally flattens to
      # testnet-<run_id>.prom / paper-<run_id>.prom.
      - ../data/observability/textfile:/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"

  loki:
    image: grafana/loki:3.2.1
    container_name: trader-loki
    restart: unless-stopped
    user: "10001:10001"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    container_name: trader-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ../data/testnet:/data/testnet:ro
      - ../data/paper:/data/paper:ro
      - ./watchdog:/data/watchdog:ro
      - promtail_positions:/var/lib/promtail
    ports:
      - "127.0.0.1:9080:9080"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    container_name: trader-grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_HTTP_PORT: "3000"
      # 仅本机 loopback (127.0.0.1:3000) 暴露, 公网不可达;
      # 关闭 brute-force lockout 避免反复输错时账号被锁 5 分钟.
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

  # Postgres + TimescaleDB + pgvector — Phase 3 entry 提前启服务
  # (ADR-001 §6 2026-05-21 修订第二段):
  # - 仅启服务, 不迁移 SignalStore (SQLite 仍是默认)
  # - host 端口绑 127.0.0.1:5433 (5432 已被无关的 nishiki-postgres 占)
  # - timescale/timescaledb-ha:pg16 镜像自带 pgvector
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-trader}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-trader_local_pg}"
      POSTGRES_DB: "${POSTGRES_DB:-trader}"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 6

